    property="og:type"

  >

  >

  <style>
    .audio-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      direction: ltr;
    }

    .language-switcher a {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid rgba(40, 70, 110, .18);
      border-radius: 10px;
      text-decoration: none;
    }

    .language-switcher a[aria-current="page"] {
      font-weight: 700;
    }

    .audio-header {
      margin-bottom: 28px;
    }

    .audio-title {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
    }

    .audio-subtitle {
      margin: 0;
      opacity: .8;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
      );
      gap: 18px;
      margin-top: 28px;
    }

    .audio-card {
      border: 1px solid rgba(40, 70, 110, .18);
      border-radius: 18px;
      padding: 18px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 24px rgba(30, 60, 100, .08);
    }

    .audio-card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .audio-card p {
      line-height: 1.8;
    }

    .audio-player {
      width: 100%;
      margin-top: 12px;
    }

    .audio-status {
      margin-top: 14px;
      font-size: 14px;
      opacity: .75;
    }

    .audio-note {
      margin-top: 30px;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(60, 100, 180, .08);
    }
  </style>
</head>

<body>

  <main class="audio-shell">

    <nav
      class="language-switcher"
      aria-label="انتخاب زبان"
    >
      <a
        href="./audio.html"
        lang="fa"
        hreflang="fa"
        dir="rtl"
        aria-current="page"
      >
        فارسی
      </a>

      <a
        href="./en/audio.html"
        lang="en"
        hreflang="en"
      >
        English
      </a>

      <a
        href="./de/audio.html"
        lang="de"
        hreflang="de"
      >
        Deutsch
      </a>
    </nav>

    <header class="audio-header">

      <h1 class="audio-title">
        کتابخانه صوتی
      </h1>

      <p class="audio-subtitle">
        نسخه آزمایشی کتابخانه صوتی نظم داد
      </p>

    </header>

    <section class="audio-grid">

      <article
        class="audio-card"
        data-audio-card
      >

        <h2>
          نمونه صوتی
        </h2>

        <p>
          این فایل فقط برای آزمایش Player و مسیرهای فایل
          استفاده می‌شود.
        </p>

        <audio
          class="audio-player"
          controls
          preload="metadata"
          src="../nazm-dad-release-final/nazm-dad-vnext/assets/media/audio/sample.mp3"
        >
        </audio>

        <div
          class="audio-status"
          data-audio-status
        >
          آماده پخش
        </div>

      </article>

    </section>

    <div class="audio-note">
      این نسخه فقط Stage است و هنوز وارد پروژه اصلی نشده است.
    </div>

  </main>

  <script src="./audio-player-standalone.js"></script>

</body>
</html>
